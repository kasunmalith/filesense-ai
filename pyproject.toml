[build-system]
requires = ["setuptools>=69,<81", "wheel>=0.42,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "filesense-ai"
version = "0.1.0"
description = "Private, local-first desktop file search with optional AI retrieval"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Energetic Edge (Pvt) Ltd" }]
dependencies = [
  "PySide6>=6.7,<6.10",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "Pillow>=10.4,<13",
  "charset-normalizer>=3.4,<4",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.3,<6", "numpy>=1.26,<3", "huggingface-hub>=0.26,<2"]
image-ai = ["open-clip-torch>=2.29,<3", "torch>=2.5,<3", "numpy>=1.26,<3", "huggingface-hub>=0.26,<2"]
spreadsheet = ["openpyxl>=3.1,<4"]
duplicates = ["imagehash>=4.3,<5"]
chat = []
demo = ["reportlab>=4.2,<5"]
dev = ["pytest>=8.3,<9", "pytest-qt>=4.4,<5", "ruff>=0.8,<1", "reportlab>=4.2,<5"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
filesense-ai = "filesense_ai.bootstrap:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["slow: optional model or performance checks", "integration: service integration tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
