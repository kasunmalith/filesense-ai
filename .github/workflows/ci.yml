name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
      - name: Install project and test tools
        run: python -m pip install -e ".[dev,spreadsheet,duplicates,chat]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Tests
        run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Compile
        run: python -m compileall -q src tests
