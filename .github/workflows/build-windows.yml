name: Build Windows onedir app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
      - name: Install build dependencies
        run: python -m pip install -e ".[semantic,image-ai,spreadsheet,duplicates,chat,build]"
      - name: Build onedir executable
        run: python -m PyInstaller --noconfirm --clean .\FileSenseAI.spec
      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileSenseAI-Windows-x64
          path: dist/FileSenseAI/
          if-no-files-found: error
          retention-days: 14
