name: Bug report
description: Report a reproducible issue without sharing private indexed files.
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Do not include private file contents or personal paths.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FileSense AI version and Python version
    validations:
      required: true
